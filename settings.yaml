ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    local:
      displayName: Local
      apiKeyEnv: LOCAL_API_KEY
      api: openai-completions
      # llama-swap direct, not the 61519 proxy_rewrite.ts sidecar: that proxy
      # buffers streaming responses to rewrite malformed tool calls, and its
      # accumulator reads only delta.content, so delta.reasoning never reaches
      # the client. A thinking model loses its own deliberation between turns
      # and re-derives the same tool call indefinitely. vLLM's native tool
      # parser makes the rewriting a no-op for this entry; the cost of
      # bypassing is the proxy's stream_options.include_usage injection.
      baseURL: http://127.0.0.1:61515/v1
      models:
        - id: qwen3.8-27b-fp8
          name: Qwen3.8-27B FP8 (vLLM)
          contextWindow: 262144
          input:
            - text
            - image
          reasoningEfforts:
            off: none
            low: low
            medium: medium
            high: high
            xhigh: xhigh
agent-default-model:
  provider: local
  model: qwen3.8-27b-fp8
ui-theme:
  preference: light
