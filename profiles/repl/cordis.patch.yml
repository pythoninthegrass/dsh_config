# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

- id: hmr
  disabled: true

- insert:
    # Core execution capability required by dsh-tools; every bundle mounts
    # it explicitly (dsh-base leaves it out — see dsh-headless, dsh-web-app).
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: repl-runner
      name: 'dsh-repl-runner'

    # MCP servers — mirrors ../../.mcp.json. Each instance connects to one
    # server and registers its tools globally on ctx.tools as
    # mcp__<serverName>__<rawName> (see @deepseek-ai/dsh-mcp-client's README).
    - id: mcp-backlog
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: backlog
        transport: stdio
        command: backlog
        args: ['mcp', 'start']

    # context7 and serena are wrapped in `bash -c '... 2>>log'` because the MCP
    # SDK's StdioClientTransport defaults child stderr to `inherit` and
    # dsh-mcp-client's config schema has no field to override it — this is
    # the only way to stop their startup/shutdown INFO logs from spamming the
    # REPL without patching node_modules. Logs land in ~/.dsh/logs/ for
    # debugging instead of being discarded outright.
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: bash
        args:
          [
            '-c',
            'mkdir -p "$HOME/.dsh/logs" && exec npx -y @upstash/context7-mcp 2>>"$HOME/.dsh/logs/mcp-context7.log"',
          ]

    - id: mcp-serena
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: serena
        transport: stdio
        command: bash
        args:
          [
            '-c',
            'mkdir -p "$HOME/.dsh/logs" && exec uvx --from git+https://github.com/oraios/serena serena start-mcp-server --context ide --project-from-cwd 2>>"$HOME/.dsh/logs/mcp-serena.log"',
          ]

    - id: mcp-tinyfish
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tinyfish
        transport: streamable-http
        url: https://agent.tinyfish.ai/mcp
        headers:
          X-API-Key: !!js process.env.TINYFISH_API_KEY

