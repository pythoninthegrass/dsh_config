# Patch layer for this dsh profile: id-targeted config overrides, disables,
# and insert lists (`!!js` expressions allowed), applied after every bundle layer.

- insert:
    # MCP servers — mirrors ../../.mcp.json. See README "Profiles & MCP".
    # dsh web is loopback-only by design — see README "web profile exposure".
    - id: mcp-backlog
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: backlog
        transport: stdio
        command: backlog
        args: ['mcp', 'start']

    # bash -c wrapping redirects stderr — see README "Profiles & MCP".
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: bash
        args:
          [
            '-c',
            'mkdir -p "$HOME/.dsh/logs" && exec npx -y @upstash/context7-mcp 2>>"$HOME/.dsh/logs/mcp-context7.log"',
          ]

    - id: mcp-serena
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: serena
        transport: stdio
        command: bash
        args:
          [
            '-c',
            'mkdir -p "$HOME/.dsh/logs" && exec uvx --from git+https://github.com/oraios/serena serena start-mcp-server --context ide --project-from-cwd 2>>"$HOME/.dsh/logs/mcp-serena.log"',
          ]

    - id: mcp-tinyfish
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tinyfish
        transport: streamable-http
        url: https://agent.tinyfish.ai/mcp
        headers:
          X-API-Key: !!js process.env.TINYFISH_API_KEY
